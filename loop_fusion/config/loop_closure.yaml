# 回环可调参数：关键帧间隔、Scan Context 匹配和地图分辨率。
keyframe:
  translation: 0.5             # 关键帧累计平移间隔，单位：米
  rotation_deg: 10.0           # 关键帧累计旋转间隔，单位：度
sc:
  max_radius: 80.0             # Scan Context 描述范围，单位：米
  distance_threshold: 0.3      # Scan Context 匹配阈值，越小越严格
output:
  map_voxel: 0.3               # 地图体素边长，单位：米；用于回环优化地图
